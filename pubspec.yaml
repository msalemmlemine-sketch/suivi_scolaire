name: suivi_scolaire
description: "Suivi Scolaire — متابعة التلاميذ. Offline school-follow-up app (AR/FR)."
publish_to: "none"
version: 0.6.0+5

environment:
  sdk: ">=3.6.0 <4.0.0"

# NOTE: versions below were written without access to pub.dev from the authoring
# sandbox. Run `flutter pub get` and adjust if the resolver complains.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any                 # pinned transitively by flutter_localizations
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  excel: ^4.0.6
  file_picker: 6.1.1
  share_plus: ^10.1.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/sql/
