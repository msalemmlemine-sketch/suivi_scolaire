name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --platforms android --project-name suivi_scolaire --org com.medsalem
      - run: rm -f test/widget_test.dart
      - name: Prepare release keystore (only if secrets are set)
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=suivi\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: python3 tools/patch_android.py android
      - run: flutter pub get
      - run: dart format lib test
      - run: python3 tools/check_localization.py
      - run: python3 tools/test_schema.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: suivi-scolaire-apk
          path: build/app/outputs/flutter-apk/app-release.apk
